name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ROMs
    uses: ./.github/workflows/ci-build.yml

  full-color:
    name: Full-color Verification
    needs: build
    uses: ./.github/workflows/ci-full-color.yml

  gameplay:
    name: Gameplay Verification
    needs: build
    uses: ./.github/workflows/ci-gameplay.yml

  certification:
    name: Certification
    needs: [build, full-color, gameplay]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification group
        env:
          BUILD: ${{ needs.build.result }}
          FULL_COLOR: ${{ needs.full-color.result }}
          GAMEPLAY: ${{ needs.gameplay.result }}
        run: |
          for result in "$BUILD" "$FULL_COLOR" "$GAMEPLAY"; do
            if [ "$result" != success ]; then
              echo "::error::verification group finished as $result"
              exit 1
            fi
          done
