name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits, for example: feat(battle): add critical-hit test"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build
        run: make -j"$(nproc)" yellow yellow_debug yellow_vc

      - name: Check for modified tracked files
        run: |
          if ! git diff-index --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff-index HEAD --
            exit 1
          fi

      - name: Stage release files
        run: |
          mkdir release
          cp pokeyellow.gbc       release/pokeyellow.gbc
          cp pokeyellow.map       release/pokeyellow.map
          cp pokeyellow.sym       release/pokeyellow.sym
          cp pokeyellow_debug.gbc release/pokeyellow-debug.gbc
          cp pokeyellow_debug.map release/pokeyellow-debug.map
          cp pokeyellow_debug.sym release/pokeyellow-debug.sym
          cp pokeyellow_vc.gbc    release/pokeyellow-vc.gbc
          cp pokeyellow_vc.map    release/pokeyellow-vc.map
          cp pokeyellow_vc.sym    release/pokeyellow-vc.sym

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pokeyellow-build
          path: release/
          if-no-files-found: error
          retention-days: 3

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Install ROM test dependencies
        run: python -m pip install -r tools/rom_tests/requirements.txt

      - name: Download debug build
        uses: actions/download-artifact@v7
        with:
          name: pokeyellow-build
          path: release

      - name: Prepare linked ROM artifacts
        run: |
          cp release/pokeyellow.gbc       pokeyellow.gbc
          cp release/pokeyellow.map       pokeyellow.map
          cp release/pokeyellow.sym       pokeyellow.sym
          cp release/pokeyellow-debug.gbc pokeyellow_debug.gbc
          cp release/pokeyellow-debug.map pokeyellow_debug.map
          cp release/pokeyellow-debug.sym pokeyellow_debug.sym
          cp release/pokeyellow-vc.gbc    pokeyellow_vc.gbc
          cp release/pokeyellow-vc.map    pokeyellow_vc.map
          cp release/pokeyellow-vc.sym    pokeyellow_vc.sym

      - name: Run unit tests
        run: python -m pytest tools/rom_tests/tests/unit

  gate-0-baseline:
    name: Gate 0 Baseline
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FULL_COLOR_RESULTS: test-results/full-color-gate0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize Gate 0 evidence root
        run: |
          mkdir -p "$FULL_COLOR_RESULTS"
          printf 'run_id=%s\nrun_attempt=%s\ncommit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            > "$FULL_COLOR_RESULTS/ci-run.txt"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Set up pinned RGBDS
        uses: ./.github/actions/setup-build

      - name: Install pinned ROM test dependencies
        run: make test-full-color-setup

      - name: Run lean Gate 0
        run: make test-full-color-gate0

      - name: Upload Gate 0 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-0-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_COLOR_RESULTS }}/
          if-no-files-found: error
          retention-days: 14

  renderer-conformance-checker:
    name: Renderer Conformance Checker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FULL_COLOR_CONFORMANCE_RESULTS: test-results/full-color-renderer-conformance

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize renderer checker evidence root
        run: |
          mkdir -p "$FULL_COLOR_CONFORMANCE_RESULTS"
          printf 'run_id=%s\nrun_attempt=%s\ncommit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            > "$FULL_COLOR_CONFORMANCE_RESULTS/ci-run.txt"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Install pinned ROM test dependencies
        run: make test-full-color-setup

      - name: Run renderer conformance checker
        run: make test-full-color-renderer-conformance

      - name: Upload renderer checker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderer-conformance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_COLOR_CONFORMANCE_RESULTS }}/
          if-no-files-found: error
          retention-days: 14
