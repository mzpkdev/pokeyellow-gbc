name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits, for example: feat(battle): add critical-hit test"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build
        run: make -j"$(nproc)"

      - name: Check for modified tracked files
        run: |
          if ! git diff-index --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff-index HEAD --
            exit 1
          fi

      - name: Stage release files
        run: |
          mkdir release
          cp pokeyellow.gbc       release/pokeyellow.gbc
          cp pokeyellow.map       release/pokeyellow.map
          cp pokeyellow.sym       release/pokeyellow.sym
          cp pokeyellow_debug.gbc release/pokeyellow-debug.gbc
          cp pokeyellow_debug.map release/pokeyellow-debug.map
          cp pokeyellow_debug.sym release/pokeyellow-debug.sym

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pokeyellow-build
          path: release/
          if-no-files-found: error
          retention-days: 3

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Install ROM test dependencies
        run: python -m pip install -r tools/rom_tests/requirements.txt

      - name: Download debug build
        uses: actions/download-artifact@v7
        with:
          name: pokeyellow-build
          path: release

      - name: Prepare linked debug artifacts
        run: |
          cp release/pokeyellow-debug.gbc pokeyellow_debug.gbc
          cp release/pokeyellow-debug.map pokeyellow_debug.map
          cp release/pokeyellow-debug.sym pokeyellow_debug.sym

      - name: Run unit tests
        run: python -m pytest tools/rom_tests/tests/unit

  gate-0-baseline:
    name: Gate 0 Baseline
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Install ROM test dependencies
        run: python -m pip install -r tools/rom_tests/requirements.txt

      - name: Download debug build
        uses: actions/download-artifact@v7
        with:
          name: pokeyellow-build
          path: release

      - name: Prepare linked debug artifacts
        run: |
          cp release/pokeyellow-debug.gbc pokeyellow_debug.gbc
          cp release/pokeyellow-debug.map pokeyellow_debug.map
          cp release/pokeyellow-debug.sym pokeyellow_debug.sym

      - name: Run deterministic baseline discovery twice
        run: |
          python -m tools.rom_tests.full_color.baseline_discovery > gate-0-run-1.json
          python -m tools.rom_tests.full_color.baseline_discovery > gate-0-run-2.json
          cmp gate-0-run-1.json gate-0-run-2.json

      - name: Run deterministic inventory progress twice
        run: |
          python -m tools.rom_tests.full_color.baseline_inventory > gate-0-inventory-progress-1.json
          python -m tools.rom_tests.full_color.baseline_inventory > gate-0-inventory-progress-2.json
          cmp gate-0-inventory-progress-1.json gate-0-inventory-progress-2.json
          cp gate-0-inventory-progress-1.json gate-0-inventory-progress.json

      - name: Run deterministic bank torture twice
        run: |
          python -m tools.rom_tests.full_color.bank_torture > gate-0-bank-torture-1.json
          python -m tools.rom_tests.full_color.bank_torture > gate-0-bank-torture-2.json
          cmp gate-0-bank-torture-1.json gate-0-bank-torture-2.json
          cp gate-0-bank-torture-1.json gate-0-bank-torture.json

      - name: Validate debug observability
        run: python -m tools.rom_tests.full_color.runtime_observability --snapshot-output gate-0-semantic-snapshot.json > gate-0-observability.json

      - name: Upload Gate 0 evidence
        uses: actions/upload-artifact@v7
        with:
          name: gate-0-baseline-discovery
          path: |
            gate-0-run-1.json
            gate-0-run-2.json
            gate-0-inventory-progress.json
            gate-0-bank-torture.json
            gate-0-observability.json
            gate-0-semantic-snapshot.json
          if-no-files-found: error
          retention-days: 14
