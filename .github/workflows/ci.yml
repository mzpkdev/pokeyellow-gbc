name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  donor-provenance:
    name: Donor Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POKERED_GBC_ROOT: ${{ github.workspace }}/pokered-gbc-donor

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout pinned pokered-gbc donor
        uses: actions/checkout@v7
        with:
          repository: dannye/pokered-gbc
          ref: c1a3b6c5a7591472241036d0cf09c3817f841f93
          path: pokered-gbc-donor
          fetch-depth: 0

      - name: Normalize donor origin
        run: git -C "$POKERED_GBC_ROOT" remote set-url origin git@github.com:dannye/pokered-gbc.git

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Install comparator dependencies
        run: python -m pip install -r tools/rom_tests/requirements.txt

      - name: Run exact donor comparator
        run: python -m pytest tools/rom_tests/tests/unit/full_color/test_overworld_color_data_donor.py -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build
        run: make -j"$(nproc)" yellow yellow_debug yellow_vc

      - name: Check for modified tracked files
        run: |
          if ! git diff-index --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff-index HEAD --
            exit 1
          fi

      - name: Stage release files
        run: |
          mkdir release
          cp pokeyellow.gbc       release/pokeyellow.gbc
          cp pokeyellow.map       release/pokeyellow.map
          cp pokeyellow.sym       release/pokeyellow.sym
          cp pokeyellow_debug.gbc release/pokeyellow-debug.gbc
          cp pokeyellow_debug.map release/pokeyellow-debug.map
          cp pokeyellow_debug.sym release/pokeyellow-debug.sym
          cp pokeyellow_vc.gbc    release/pokeyellow-vc.gbc
          cp pokeyellow_vc.map    release/pokeyellow-vc.map
          cp pokeyellow_vc.sym    release/pokeyellow-vc.sym

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pokeyellow-build
          path: release/
          if-no-files-found: error
          retention-days: 3

  test:
    name: Test
    needs:
      - donor-provenance
      - lint
      - build
      - gate-0-baseline
      - renderer-conformance-checker
      - phase1-runtime-ownership
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every certification gate
        env:
          DONOR: ${{ needs.donor-provenance.result }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
          GATE0: ${{ needs.gate-0-baseline.result }}
          CONFORMANCE: ${{ needs.renderer-conformance-checker.result }}
          RUNTIME: ${{ needs.phase1-runtime-ownership.result }}
        run: |
          for result in "$DONOR" "$LINT" "$BUILD" "$GATE0" "$CONFORMANCE" "$RUNTIME"; do
            if [ "$result" != success ]; then
              echo "::error::certification dependency finished as $result"
              exit 1
            fi
          done

  gate-0-baseline-runs:
    name: Gate 0 Baseline Run ${{ matrix.run }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    env:
      FULL_COLOR_RESULTS: test-results/full-color-gate0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize Gate 0 evidence root
        run: |
          mkdir -p "$FULL_COLOR_RESULTS/run-${{ matrix.run }}/diagnostics"
          printf 'run_id=%s\nrun_attempt=%s\ncommit=%s\nmatrix_run=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            "${{ matrix.run }}" \
            > "$FULL_COLOR_RESULTS/run-${{ matrix.run }}/diagnostics/ci-run.txt"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Set up pinned RGBDS
        uses: ./.github/actions/setup-build

      - name: Install pinned ROM test dependencies
        run: make test-full-color-setup

      - name: Build Phase 2 audit ROM
        run: make -j"$(nproc)" yellow_phase2_audit

      - name: Run one complete lean Gate 0 execution
        run: make test-full-color-gate0-ci-run FULL_COLOR_GATE0_RUN=${{ matrix.run }}

      - name: Upload Gate 0 run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-0-run-${{ matrix.run }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_COLOR_RESULTS }}/run-${{ matrix.run }}/
          if-no-files-found: error
          retention-days: 14

  gate-0-baseline:
    name: Gate 0 Baseline
    needs: gate-0-baseline-runs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FULL_COLOR_RESULTS: test-results/full-color-gate0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Gate 0 run 1 evidence
        uses: actions/download-artifact@v7
        with:
          name: gate-0-run-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_COLOR_RESULTS }}/run-1

      - name: Download Gate 0 run 2 evidence
        uses: actions/download-artifact@v7
        with:
          name: gate-0-run-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_COLOR_RESULTS }}/run-2

      - name: Compare independent Gate 0 evidence
        run: make test-full-color-gate0-ci-compare

      - name: Upload compared Gate 0 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-0-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_COLOR_RESULTS }}/
          if-no-files-found: error
          retention-days: 14

  renderer-conformance-checker:
    name: Renderer Conformance Checker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FULL_COLOR_CONFORMANCE_RESULTS: test-results/full-color-renderer-conformance

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize renderer checker evidence root
        run: |
          mkdir -p "$FULL_COLOR_CONFORMANCE_RESULTS"
          printf 'run_id=%s\nrun_attempt=%s\ncommit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            > "$FULL_COLOR_CONFORMANCE_RESULTS/ci-run.txt"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Install pinned ROM test dependencies
        run: make test-full-color-setup

      - name: Run renderer conformance checker
        run: make test-full-color-renderer-conformance

      - name: Upload renderer checker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderer-conformance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_COLOR_CONFORMANCE_RESULTS }}/
          if-no-files-found: error
          retention-days: 14

  phase1-runtime-ownership:
    name: Phase 1 Runtime Ownership
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FULL_COLOR_RUNTIME_RESULTS: test-results/full-color-renderer-runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize Phase 1 runtime evidence root
        run: |
          mkdir -p "$FULL_COLOR_RUNTIME_RESULTS"
          printf 'run_id=%s\nrun_attempt=%s\ncommit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            > "$FULL_COLOR_RUNTIME_RESULTS/ci-run.txt"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Set up pinned RGBDS
        uses: ./.github/actions/setup-build

      - name: Install pinned ROM test dependencies
        run: make test-full-color-setup

      - name: Download debug ROM evidence
        uses: actions/download-artifact@v7
        with:
          name: pokeyellow-build
          path: release

      - name: Prepare debug ROM evidence
        run: |
          cp release/pokeyellow-debug.gbc pokeyellow_debug.gbc
          cp release/pokeyellow-debug.map pokeyellow_debug.map
          cp release/pokeyellow-debug.sym pokeyellow_debug.sym

      - name: Run Phase 1 runtime ownership
        run: make test-full-color-renderer-runtime

      - name: Upload Phase 1 runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase1-runtime-ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_COLOR_RUNTIME_RESULTS }}/
          if-no-files-found: error
          retention-days: 14
