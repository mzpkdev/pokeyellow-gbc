name: CI Gameplay

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            suite: core
            target: test-full-color-e2e-core
          - name: Renderer
            suite: renderer
            target: test-full-color-e2e-renderer
          - name: Journey
            suite: journey
            target: test-full-color-e2e-journey
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Install ROM test dependencies
        run: make test-full-color-setup

      - name: Download same-revision test products
        uses: actions/download-artifact@v7
        with:
          name: pokeyellow-test-products
          path: .

      - name: Run gameplay suite
        run: make ROM_TEST_PREBUILT_PRODUCTS=1 ${{ matrix.target }}

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.suite }}-failure-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
