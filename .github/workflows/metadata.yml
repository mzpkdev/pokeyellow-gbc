name: Metadata

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action || 'code' }}
  cancel-in-progress: true

jobs:
  lint:
    name: Workflow Lint
    if: github.event_name == 'push' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

  title:
    name: ${{ github.event.action == 'reopened' && 'PR Reopen Certification' || 'PR Title' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Lint pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits"
            exit 1
          fi

      - name: Require prior certification when reopening
        if: github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! check_run_pages="$(gh api --paginate --slurp \
            "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" \
            2>/dev/null)"; then
            echo "::error::could not enumerate Certification check runs for reopened head SHA"
            exit 1
          fi

          if ! successful_certification_count="$(jq -er \
            '[.[] | .check_runs[] | select(.name == "Certification" and .conclusion == "success")] | length' \
            <<<"$check_run_pages" 2>/dev/null)"; then
            echo "::error::could not parse Certification check runs for reopened head SHA"
            exit 1
          fi

          if [ "$successful_certification_count" -lt 1 ]; then
            echo "::error::reopened head SHA has no successful Certification check run"
            exit 1
          fi
